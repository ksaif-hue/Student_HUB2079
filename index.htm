function markClass(m){ return m>=85?"good": m>=70?"mid":"low"; }
function markTag(m){ return m>=85?"ممتاز": m>=70?"جيد":"يحتاج متابعة"; }

async function commitInChunks(items, applyFn){
  const CHUNK = 450;
  for(let i=0;i<items.length;i+=CHUNK){
    const batch = db.batch();
    items.slice(i, i+CHUNK).forEach(item=>applyFn(batch,item));
    await batch.commit();
  }
}

}

// ---- توليد رمز عشوائي للبيانات التجريبية فقط (لا يُستخدم للطلاب الحقيقيين) ----
function genCode(existingCodes){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let code;
  do{
    code = "";
    for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  } while(existingCodes.has(code));
  existingCodes.add(code);
  return code;
}

function findHeaderRow(rows){
  for(let i=0;i<rows.length;i++){
    if(rows[i] && String(rows[i][0]||"").trim()==="اسم الطالب") return i;
  }
  return -1;
}

function parseSheet(rows){
  const headerIdx = findHeaderRow(rows);
  if(headerIdx === -1){
    throw new Error("لم يتم العثور على عمود \"اسم الطالب\" — تأكدي من استخدام القالب الرسمي بدون تعديل العناوين.");
  }
  const seenInFile = new Set();
  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r[0]) continue;
    const name = String(r[0]).trim();
    const grade = String(r[1]||"").trim();
    const idPart = String(r[2]||"").trim().padStart(5,'0');
    const moePart = String(r[3]||"").trim();
    if(!idPart || !moePart){
      throw new Error(`الصف الخاص بـ "${name}" ناقص: آخر 5 أرقام من الهوية أو رقم الطالب في المنهل.`);
    }
    const code = idPart + moePart;
    if(seenInFile.has(code)){
      throw new Error(`الرمز المُشتق للطالب "${name}" (${code}) مكرر مع طالب آخر في نفس الملف — تحققي من صحة الرقمين.`);
    }
    seenInFile.add(code);
    const subjects = FIXED_SUBJECTS.map((subName,idx)=>({
      name: subName,
      mark: Number(r[4+idx]) || 0
    }));
    out.push({ code, name, grade, subjects });
  }
  return out;
}

function generateSampleData(){
  const names = ["فاطمة خالد النعيمي","عبدالله راشد الظاهري","مريم علي السويدي","خالد حمد الكتبي","نورة سعيد الشامسي","سلطان محمد الحمادي"];
  const grades = ["الصف الرابع — شعبة 1","الصف الرابع — شعبة 2","الصف الخامس — شعبة 1"];
  const existingCodes = new Set();
  return names.map(name=>({
    code: genCode(existingCodes),
    name,
    grade: grades[Math.floor(Math.random()*grades.length)],
    subjects: FIXED_SUBJECTS.map(n=>({name:n, mark: 55+Math.floor(Math.random()*45)}))
  }));
}

function bind(){
  const errBox = document.getElementById('errBox');

  if(state.view==="code"){
    document.getElementById('codeBtn').onclick = async ()=>{
      const idPart = document.getElementById('idPartInput').value.trim().padStart(5,'0');
      const moePart = document.getElementById('moePartInput').value.trim();
      if(!idPart.match(/^\d{5}$/) || !moePart){
        errBox.innerHTML = `<div class="err">أدخلي آخر 5 أرقام من الهوية ورقم الطالب في المنهل كاملَين.</div>`;
        return;
      }
      const val = idPart + moePart;
      const btn = document.getElementById('codeBtn');
      btn.disabled = true; btn.textContent = "جارٍ التحقق...";
      try{
        const doc = await db.collection(STUDENTS_COL).doc(val).get();
        if(!doc.exists){
          errBox.innerHTML = `<div class="err">لا يوجد حساب مطابق لهذين الرقمين. تأكدي من صحة البيانات المرسلة من المدرسة.</div>`;
          btn.disabled = false; btn.textContent = "متابعة";
          return;
        }
        state.code = val;
        state.studentData = doc.data();
        state.view = "dashboard";
        render();
      }catch(err){
        errBox.innerHTML = `<div class="err">تعذّر الاتصال بالخادم (${err.code||err.message}). تأكدي من نشر قواعد أمان Firestore واتصال الإنترنت.</div>`;
        btn.disabled = false; btn.textContent = "متابعة";
      }
    };
    document.getElementById('toAdmin').onclick = ()=>{ state.view = state.adminUnlocked ? "admin" : "adminGate"; render(); };
  }

  if(state.view==="adminGate"){
    document.getElementById('backFromGate').onclick = ()=>{ resetToCode(); render(); };
    document.getElementById('gateBtn').onclick = async ()=>{
      const email = document.getElementById('adminEmailInput').value.trim();
      const pass = document.getElementById('adminPassInput').value;
      const btn = document.getElementById('gateBtn');
      btn.disabled = true; btn.textContent = "جارٍ الدخول...";
      try{
        await auth.signInWithEmailAndPassword(email, pass);
        state.adminUnlocked = true;
        state.view = "admin";
        render();
      }catch(err){
        document.getElementById('gateErr').innerHTML = `<div class="err">بيانات الدخول غير صحيحة أو الحساب غير موجود.</div>`;
        btn.disabled = false; btn.textContent = "دخول";
      }
    };
  }

  if(state.view==="admin"){
    document.getElementById('backFromAdmin').onclick = ()=>{ resetToCode(); render(); };
    document.getElementById('signOutBtn').onclick = async ()=>{ await auth.signOut(); resetToCode(); render(); };
    document.getElementById('schoolNameInput').oninput = (e)=>{ state.schoolName = e.target.value; state.schoolSaved = false; };
    document.getElementById('saveSchoolBtn').onclick = async ()=>{
      const val = document.getElementById('schoolNameInput').value.trim();
      const btn = document.getElementById('saveSchoolBtn');
      btn.disabled = true; btn.textContent = "جارٍ الحفظ...";
      try{
        await SETTINGS_DOC.set({ schoolName: val }, { merge:true });
        state.schoolName = val;
        state.schoolSaved = true;
        render();
      }catch(err){
        document.getElementById('schoolSavedMsg').innerHTML = `<div class="err">تعذّر الحفظ: ${err.message}</div>`;
        btn.disabled = false; btn.textContent = "حفظ اسم المدرسة";
      }
    };
    document.getElementById('wipeBtn').onclick = async ()=>{
      const btn = document.getElementById('wipeBtn');
      btn.disabled = true;
      try{
        const snap = await db.collection(STUDENTS_COL).get();
        if(snap.empty){
          state.wipeMsg = "لا توجد بيانات مرفوعة لحذفها حاليًا.";
          render();
          return;
        }
        const ok = confirm(`سيتم حذف بيانات ${snap.size} طالب نهائيًا من قاعدة البيانات الحقيقية. هذا الإجراء لا يمكن التراجع عنه. هل تريدين المتابعة؟`);
        if(!ok){ btn.disabled = false; return; }
        await commitInChunks(snap.docs, (batch,doc)=>batch.delete(doc.ref));
        state.generated = [];
        state.wipeMsg = `تم حذف بيانات ${snap.size} طالب.`;
        render();
      }catch(err){
        document.getElementById('adminErr').innerHTML = `<div class="err">تعذّر الحذف: ${err.message}</div>`;
        btn.disabled = false;
      }
    };
    const dz = document.getElementById('dropZone');
    const fi = document.getElementById('fileInput');
    dz.onclick = ()=> fi.click();
    fi.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const wb = XLSX.read(ev.target.result, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1});
          state.generated = parseSheet(rows.filter(r=>r.length));
          render();
        }catch(err){
          document.getElementById('adminErr').innerHTML = `<div class="err">${err.message || 'تعذّرت قراءة الملف. تأكدي من تنسيقه.'}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    };
    const sampleBtn = document.getElementById('sampleBtn');
    if(sampleBtn) sampleBtn.onclick = ()=>{ state.generated = generateSampleData(); render(); };
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.onclick = ()=>{
      const wsData = [["الاسم","الرمز"], ...state.generated.map(g=>[g.name,g.code])];
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "رموز الأهالي");
      XLSX.writeFile(wb, "رموز_الأهالي.xlsx");
    };
    const loadBtn = document.getElementById('loadToSystemBtn');
    if(loadBtn) loadBtn.onclick = async ()=>{
      loadBtn.disabled = true; loadBtn.textContent = "جارٍ الحفظ...";
      try{
        const checks = await Promise.all(state.generated.map(g=>db.collection(STUDENTS_COL).doc(g.code).get()));
        const conflictIdx = checks.findIndex(d=>d.exists);
        if(conflictIdx !== -1){
          const g = state.generated[conflictIdx];
          const existingName = checks[conflictIdx].data().name;
          throw new Error(`الرمز الخاص بـ "${g.name}" (${g.code}) موجود مسبقًا لطالب آخر باسم "${existingName}". لم يُحفظ أي طالب حتى يُحل هذا التعارض.`);
        }
        await commitInChunks(state.generated, (batch,g)=>{
          const ref = db.collection(STUDENTS_COL).doc(g.code);
          batch.set(ref, { name:g.name, grade:g.grade, term:"الفصل الدراسي الأول ٢٠٢٦", subjects:g.subjects });
        });
        const savedCount = state.generated.length;
        resetToCode();
        state.uploadMsg = `تم حفظ ${savedCount} طالب في قاعدة البيانات.`;
        render();
      }catch(err){
        document.getElementById('adminErr').innerHTML = `<div class="err">${err.message}</div>`;
        loadBtn.disabled = false; loadBtn.textContent = "حفظ في قاعدة البيانات";
      }
    };
  }

  if(state.view==="dashboard"){
    document.getElementById('logoutBtn').onclick = ()=>{ resetToCode(); render(); };
  }
}

async function bootstrap(){
  try{
    const snap = await SETTINGS_DOC.get();
    if(snap.exists && snap.data().schoolName) state.schoolName = snap.data().schoolName;
  }catch(err){ /* استمرار بالاسم الافتراضي لو تعذّر الاتصال */ }
  render();
}
bootstrap();
</script>
